name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Spark + Delta tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as Fabric Spark runtime 1.3
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev,local]"
      - run: ruff check . && ruff format --check .
      - name: notebook builds are up to date
        run: python scripts/build_notebooks.py --check
      - name: tests (including Delta MERGE / replaceWhere and backfill)
        run: pytest -q -rs

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false
      - run: terraform validate

  dbt:
    name: dbt parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install dbt-fabric
      - run: dbt parse --profiles-dir .
        working-directory: dbt

  airflow:
    name: DAGs import cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install "apache-airflow==2.10.5" apache-airflow-microsoft-fabric-plugin \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"
      - name: load every DAG
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
        run: |
          airflow db migrate > /dev/null
          python - <<'PY'
          from airflow.models import DagBag
          bag = DagBag(include_examples=False)
          assert not bag.import_errors, bag.import_errors
          print(sorted(bag.dag_ids))
          assert len(bag.dag_ids) == 5
          PY
